[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "territorios-es"
version = "0.3.0"
description = "Spanish territories and countries: codes, names in every official language, search."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/alertapublica/territorios-es"

[tool.hatch.build.targets.wheel]
packages = ["python/territorios_es"]

[tool.hatch.build.targets.wheel.force-include]
"datos/territorios.json" = "territorios_es/datos/territorios.json"
"datos/codigos-postales.csv" = "territorios_es/datos/codigos-postales.csv"
