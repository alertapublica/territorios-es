name: Generar datos

# Descarga las fuentes (INE, Eurostat, Catastro, IGN, Justicia, AEMET, Idescat, Aragón, Wikidata), regenera datos/ y escribe el informe de
# discrepancias. No se lanza en las PR: la CI ya prueba el código sin red, y cada descarga son
# ~20 minutos y unas 90 peticiones a terceros. Para probar un lector nuevo, una vez y a mano sobre
# la rama: gh workflow run generar.yml --ref <rama> (deja el artefacto y el resumen, sube datos/ a esa
# rama con un commit y vuelve a lanzar la CI, que un push de Actions no dispara).
# En main, a mano o cada mes, además abre una PR con los datos y actualiza el issue del informe.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 3 * *"

permissions:
  contents: read

concurrency:
  group: generar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y generar
        env:
          # Relay con IP española para los hosts de VIA_RELAY (generador/descargas.py); sin clave, directa.
          RELAY_CLAVE: ${{ secrets.RELAY_CLAVE }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          # Clave de AEMET OpenData para el maestro de municipios (zonas de aviso); sin ella falla.
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python -m generador --informe informe.md --cache .cache
      - name: Resumen
        if: always()
        run: if [ -f informe.md ]; then cat informe.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Comprobar coherencia
        run: python -m generador --check
      - name: Límites municipales (fichero de cada versión; aquí solo como artefacto)
        run: python -m generador --limites limites-municipios.geojson.gz --cache .cache
      - uses: actions/upload-artifact@v4
        with:
          name: limites
          path: limites-municipios.geojson.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datos
          path: |
            datos/
            informe.md
          if-no-files-found: ignore

  publicar:
    needs: generar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: datos
      - name: Abrir PR con los datos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          rama="datos/actualizacion-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git commit -q -m "datos: regeneración desde las fuentes"
          git push -q origin "$rama"
          # La organización puede no permitir que Actions abra PR: entonces queda la rama y un aviso.
          gh pr create --base main --head "$rama" --title "Datos: regeneración desde las fuentes" --body-file informe.md \
            || echo "::warning::No se pudo abrir la PR. Ábrela a mano: https://github.com/$GITHUB_REPOSITORY/compare/$rama?expand=1"
      - name: Actualizar el issue del informe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="Informe del generador: discrepancias entre fuentes"
          numero=$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh issue edit "$numero" --body-file informe.md
          else
            gh issue create --title "$titulo" --body-file informe.md
          fi

  # Lanzado a mano en otra rama (la de una PR que cambia el generador): datos/ va a esa misma rama, sin
  # bajarlo a ningún ordenador. El push de Actions no dispara la CI, así que se lanza aparte.
  subir-a-la-rama:
    needs: generar
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: datos
      - name: Commit de datos/ en la rama y CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "datos: generación $GITHUB_RUN_ID"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
