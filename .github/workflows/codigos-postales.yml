name: Códigos postales

# Descarga las direcciones del Catastro (INSPIRE Addresses, un ZIP por municipio), de IDENA
# (Navarra) y de Eustat (País Vasco), regenera datos/codigos-postales.csv y escribe su informe, con
# el contraste con el callejero del INE (que no se publica). Va aparte de generar.yml porque son unas
# 7.700 descargas a un servidor lento y tarda horas; los datos cambian poco, así que basta con dos
# veces al año, después de la tirada mensual de enero y de julio. Lee el cruce DGC→INE del
# datos/territorios.json publicado. Sobre una rama deja el artefacto y el resumen y no publica; en
# main, además, abre una PR con la tabla.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 10 1,7 *"
  # TEMPORAL: tirada de medida sobre la rama (workflow_dispatch solo sirve para workflows que ya están
  # en main). Quitar antes de abrir la PR.
  push:
    branches: [codigos-postales]
    paths: [.github/workflows/codigos-postales.yml]

permissions:
  contents: read

concurrency:
  group: codigos-postales-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Los originales del Catastro solo viven en esta caché, nunca en el repo. GitHub la borra a los 7
      # días sin uso: sirve para reanudar una tirada que falla, no de una tirada a la siguiente.
      - name: Recuperar las descargas
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: codigos-postales-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: codigos-postales-
      - name: Descargar y generar
        timeout-minutes: 300
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m generador --codigos-postales --informe informe.md --cache .cache
      - name: Guardar las descargas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: codigos-postales-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Resumen
        if: always()
        run: if [ -f informe.md ]; then cat informe.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Comprobar coherencia
        run: python -m generador --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codigos-postales
          path: |
            datos/codigos-postales.csv
            datos/manifiesto.json
            informe.md
          if-no-files-found: ignore

  publicar:
    needs: generar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codigos-postales
      - name: Abrir PR con la tabla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios en los códigos postales"; exit 0; fi
          rama="datos/codigos-postales-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git commit -q -m "datos: códigos postales desde las fuentes"
          git push -q origin "$rama"
          # La organización puede no permitir que Actions abra PR: entonces queda la rama y un aviso.
          gh pr create --base main --head "$rama" --title "Datos: códigos postales" --body-file informe.md \
            || echo "::warning::No se pudo abrir la PR. Ábrela a mano: https://github.com/$GITHUB_REPOSITORY/compare/$rama?expand=1"
