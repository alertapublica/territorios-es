name: CI

on:
  push:
    branches: [main]
  pull_request:
  # generar.yml la lanza tras subir datos/ a la rama de una PR (su push no la dispara).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pruebas de Python
        run: python -m unittest discover -s pruebas -t . -v
      - name: Pruebas de JavaScript
        run: node --test pruebas/*.test.mjs
      - name: Datos de prueba al día
        run: |
          python -m generador --fixture
          git diff --exit-code pruebas/datos
      - name: Mapa de estado al día (docs/estado.md y docs/status.md)
        run: python web/estado.py --check
      - name: Coherencia de datos/
        if: hashFiles('datos/manifiesto.json') != ''
        run: python -m generador --check
      - name: Paquete de Python instalable
        if: hashFiles('datos/territorios.json') != ''
        run: |
          python -m pip install --quiet .
          cd /tmp && python -c "import territorios_es as te; from territorios_es.catastro_online import locate_reference; print(te.name('es:autonomia:09', 'en'))"
      - name: Paquete de JavaScript instalable
        if: hashFiles('datos/territorios.json') != ''
        run: |
          mkdir /tmp/consumidor
          npm pack --silent --pack-destination /tmp/consumidor
          cd /tmp/consumidor && npm init -y > /dev/null
          npm install --silent --no-audit --no-fund ./territorios-es-*.tgz
          node --input-type=module -e "import { loadCatalog } from 'territorios-es'; import { locateReference } from 'territorios-es/catastro-online'; console.log(loadCatalog().name('es:autonomia:09', 'en'))"
